name: Android build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: vibe-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    # Signed, minified release APK. Runs only when the signing secrets are set in
    # GitHub: Settings > Secrets and variables > Actions.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEY: ${{ secrets.VIBE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-java@v4
        if: env.HAS_KEY == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        if: env.HAS_KEY == 'true'
      - name: Build signed release APK
        if: env.HAS_KEY == 'true'
        env:
          VIBE_KEYSTORE_BASE64: ${{ secrets.VIBE_KEYSTORE_BASE64 }}
          VIBE_KEYSTORE_PASSWORD: ${{ secrets.VIBE_KEYSTORE_PASSWORD }}
          VIBE_KEY_ALIAS: ${{ secrets.VIBE_KEY_ALIAS }}
          VIBE_KEY_PASSWORD: ${{ secrets.VIBE_KEY_PASSWORD }}
        run: |
          echo "$VIBE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vibe.jks"
          export VIBE_KEYSTORE_PATH="$RUNNER_TEMP/vibe.jks"
          ./gradlew --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/vibe.jks"
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: vibe-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error


  wake-model-vocab:
    # Diagnostic: is "vibe" in the offline model's vocabulary?
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - run: |
          curl -sSfL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip
          find vosk-model-small-en-us-0.15 -maxdepth 2 | sort
          for w in vibe vibes hey hello hi okay wipe vive vybe; do
            if grep -rqaw "$w" vosk-model-small-en-us-0.15/graph; then echo "FOUND $w"; else echo "MISSING $w"; fi
          done
          ls -la vosk-model-small-en-us-0.15/graph || true
