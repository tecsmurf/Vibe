name: Android build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: vibe-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  wake-model-checksum:
    # Records the SHA-256 of the "Hey VIBE" model archive so the app can pin it.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checksum Vosk small English model
        run: |
          curl -sSfL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          ls -l model.zip
          sha256sum model.zip
